name: Reality lab

on:
  pull_request:
  push:
    branches:
      - reality-engine-reference-20261108

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the isolated lab from a clean checkout
        run: node --experimental-strip-types --test reality-engine/*.test.ts
