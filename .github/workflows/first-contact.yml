name: First Contact offline checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: first-contact-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline:
    if: github.repository == 'mekusimeku/meku-si' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Offline verifier, compatibility entry point and simulator
        run: node --test examples/shared/*.test.mjs examples/human-cloud-simulator/simulate.test.mjs
