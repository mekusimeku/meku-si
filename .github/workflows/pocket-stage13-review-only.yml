name: Pocket Stage 13 View-Only Gate

on:
  pull_request:
    paths:
      - 'pocket-browser-test/stage13-review/**'
      - '.github/workflows/pocket-stage13-review-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-tests:
    name: View-only transfer request checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Run isolated tests; no dependencies or wallets
        run: node --test pocket-browser-test/stage13-review/review-origin-gate.test.mjs
